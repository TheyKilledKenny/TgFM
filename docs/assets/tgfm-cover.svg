    <text x="66" y="265" font-size="26" fill="#d3eee5">Telegram File Manager</text>
    <text x="66" y="337" font-size="19" fill="#d3eee5">Seleziona. Salva. Condividi.</text>
  </g>
  <g transform="translate(678 66)" font-family="Arial, Helvetica, sans-serif">
    <rect width="454" height="268" rx="18" fill="#f5f8f7"/>
    <text x="26" y="44" font-size="18" font-weight="700" fill="#154a46">DAI TUOI CANALI AI TUOI FILE</text>
