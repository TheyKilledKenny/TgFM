    </g>
    <g stroke="#16803c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m28 87 7 7 13-15"/><path d="m28 140 7 7 13-15"/><path d="m28 193 7 7 13-15"/>
