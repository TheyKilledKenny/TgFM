<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">TgFM — Telegram File Manager</title>
  <desc id="desc">Seleziona i file dei tuoi canali e gruppi Telegram, salvali, condividili o inviali su FTP.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#063d3b"/><stop offset="1" stop-color="#006c67"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#background)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <g transform="translate(64 62)">
    <rect width="76" height="76" rx="18" fill="#e8f6ef"/>
    <path d="M16 24h18l7 7h21v28H16Z" fill="#006c67"/>
    <path d="m27 40 26-8-8 19-7-6-5 5v-8Z" fill="#fff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
